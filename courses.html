<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Knowledge Library</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>&#128218;</text></svg>" />
</head>
<body>
  <!-- Boot / session check ------------------------------------------------->
  <div id="boot" class="centered-pane">
    <p class="muted" data-i18n="auth.checking">Checking your session...</p>
  </div>

  <!-- Sign in -------------------------------------------------------------->
  <div id="auth" class="centered-pane" hidden>
    <form id="auth-form" class="card auth-card" novalidate>
      <h1 class="brand"><span class="brand-mark" aria-hidden="true">&#128218;</span> <span data-i18n="app.name"></span></h1>
      <p class="muted" data-i18n="auth.intro"></p>
      <label class="field">
        <span data-i18n="auth.email"></span>
        <input type="email" id="auth-email" name="email" autocomplete="email" required />
      </label>
      <button type="submit" class="btn primary" id="auth-submit" data-i18n="auth.send"></button>
      <p class="inline-status" id="auth-status" role="status" aria-live="polite"></p>
      <div class="lang-switch" role="group" data-i18n-aria-label="nav.language">
        <button type="button" class="lang-btn" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="vi">VI</button>
      </div>
    </form>
  </div>

  <!-- App ------------------------------------------------------------------>
  <div id="app" hidden>
    <div class="app-shell">

      <aside class="sidebar">
        <a class="brand" href="#/dashboard">
          <span class="brand-mark" aria-hidden="true">&#128218;</span>
          <span data-i18n="app.name"></span>
        </a>

        <nav class="main-nav" data-i18n-aria-label="app.name">
          <a class="nav-link" href="#/dashboard" data-route="dashboard">
            <svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true">
              <rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1" /><rect x="9" y="1.5" width="5.5" height="5.5" rx="1" />
              <rect x="1.5" y="9" width="5.5" height="5.5" rx="1" /><rect x="9" y="9" width="5.5" height="5.5" rx="1" />
            </svg>
            <span data-i18n="nav.dashboard"></span>
          </a>
          <a class="nav-link" href="#/library" data-route="library">
            <svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true">
              <rect x="1.5" y="2" width="3.5" height="12" rx="1" /><rect x="6.25" y="2" width="3.5" height="12" rx="1" />
              <rect x="11" y="3.4" width="3.5" height="10.6" rx="1" transform="rotate(-12 12.75 8.7)" />
            </svg>
            <span data-i18n="nav.library"></span>
          </a>
          <a class="nav-link" href="#/search" data-route="search">
            <svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true">
              <circle cx="7" cy="7" r="4.75" /><path d="M10.6 10.6 L14 14" />
            </svg>
            <span data-i18n="nav.search"></span>
          </a>
        </nav>

        <a class="btn primary nav-add" href="#/new" data-i18n="nav.add"></a>

        <div class="sidebar-foot">
          <div class="shortcut-hints">
            <span class="muted"><kbd>/</kbd> <span data-i18n="shortcut.search"></span></span>
            <span class="muted"><kbd>n</kbd> <span data-i18n="shortcut.new"></span></span>
            <span class="muted"><kbd>Esc</kbd> <span data-i18n="shortcut.close"></span></span>
          </div>
          <div class="sidebar-account">
            <div class="lang-switch" role="group" data-i18n-aria-label="nav.language">
              <button type="button" class="lang-btn" data-lang="en">EN</button>
              <button type="button" class="lang-btn" data-lang="vi">VI</button>
            </div>
            <button type="button" class="btn ghost" id="sign-out" data-i18n="nav.signOut"></button>
          </div>
        </div>
      </aside>

      <!-- Screens are rendered into this node by app.js / ui.js ------------>
      <main id="screen" class="screen" tabindex="-1"></main>

    </div>
  </div>

  <!-- Modal host ----------------------------------------------------------->
  <div id="modal-root" class="modal-root" hidden>
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal-panel" role="dialog" aria-modal="true" tabindex="-1">
      <button type="button" class="modal-close" data-modal-close data-i18n-aria-label="common.close">&times;</button>
      <div class="modal-body"></div>
    </div>
  </div>

  <!-- Transient messages --------------------------------------------------->
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
